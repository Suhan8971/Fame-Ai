
name: Deploy Fame-AI Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: fame-ai-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    
      - name: Inspect GitHub OIDC identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          request = urllib.request.Request(
              url + "&audience=sts.amazonaws.com",
              headers={"Authorization": f"Bearer {token}"}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy backend using AWS SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-08ecbca38ce2aa964" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Fame-AI backend from GitHub Actions" \
            --parameters '{"commands":["set -eu","sudo -u ubuntu -H bash -c '\''cd /home/ubuntu/Fame-Ai && git pull --ff-only origin main && backend/venv/bin/python -m pip install -r backend/requirements.txt'\''","systemctl restart fame-ai","systemctl is-active --quiet fame-ai","curl --fail --silent --show-error --retry 5 --retry-delay 3 http://127.0.0.1:8000/ >/dev/null"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-08ecbca38ce2aa964"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-08ecbca38ce2aa964" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
